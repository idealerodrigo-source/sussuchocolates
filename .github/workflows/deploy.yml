name: Build and Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          CI: false

      - name: Clean docs folder
        run: |
          rm -rf docs
          mkdir docs

      - name: Copy build to docs
        run: cp -r frontend/build/. docs/

      - name: Create CNAME
        run: echo "www.sussuchocolates.com.br" > docs/CNAME

      - name: Commit and push docs
        run: |
          git config user.email "admin@sussu.com"
          git config user.name "Sussu Deploy"
          git add docs/
          git diff --staged --quiet || git commit -m "auto deploy [skip ci]"
          git push